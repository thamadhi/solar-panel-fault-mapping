name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        uses: astral-sh/ruff-action@v1
        with:
          version: "0.9.10"

      - name: Run ruff
        run: ruff check src tests

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No real AI providers, Ollama, or ML model downloads are required:
      # assistant tests mock external providers and use the offline fallback,
      # and the API builds its ML handlers lazily (the handlers are mocked in
      # the API tests).
      - name: Run tests
        run: pytest tests/

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # NEXT_PUBLIC_* vars are baked at build time; a placeholder keeps the
      # build honest without pointing at any real API.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://ci.placeholder.invalid

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: openpvisor-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max