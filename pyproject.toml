[project]
name = "opensunray-insight"
version = "0.1.0"
description = "OpenSunray Insight application"
requires-python = ">=3.11"

dependencies = [
    "black==26.1.0",
    "catboost==1.2.8",
    "flake8==7.3.0",
    "Flask==3.1.3",
    "flask-cors==6.0.2",
    "python-dotenv==1.2.2",
    "huggingface_hub==1.4.1",
    "joblib==1.5.3",
    "keras_tuner==1.4.8",
    "matplotlib==3.10.8",
    "mlflow==3.9.0",
    "mlflow_skinny==3.9.0",
    "mlflow_tracing==3.9.0",
    "numpy==2.0.2",
    "opencv-python==4.13.0.92",
    "pandas==2.2.2",
    "Pillow==12.1.1",
    "plotly==6.5.2",
    "PyJWT==2.11.0",
    "pytest==9.0.2",
    "requests==2.32.5",
    "scikit-learn==1.6.1",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "shap==0.50.0",
    "streamlit==1.54.0",
    "streamlit-aggrid",
    "tensorflow==2.19.0",
    "typing_extensions==4.15.0",
    "ultralytics==8.4.14",
    "xgboost",
    "visualkeras==0.2.0"
]

[tool.vercel]
entrypoint = "src.api:app"

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks and vendored ML artefacts are not linted.
exclude = [
    ".venv",
    "build",
    "dist",
    "notebooks",
    "src/fault-localization",
    "models",
    "test_set",
    "datasets",
    "manuals",
    "docs",
    "diagrams",
    "*.ipynb",
]

[tool.ruff.lint]
# Default pyflakes + pycodestyle error subset. E501 (line length) is not
# enforced because the existing codebase predates this tooling.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing violations only. New files are checked against the full rule
# set above; these allowances keep lint green without reformatting the repo.
"src/api.py" = ["F841"]
"src/app_router.py" = ["E722"]
"src/components/Severityexplainability.py" = ["F401"]
"src/components/fault_detection_ui.py" = ["F401", "F541"]
"src/core/localisation_result.py" = ["F401"]
"src/database/chat_repo.py" = ["F401"]
"src/database/db.py" = ["E722"]
"src/database/__init__.py" = ["F401"]  # intentional re-exports
"src/handlers/*.py" = ["F401", "F541"]
"src/models/user.py" = ["F401"]
"src/pages/fault_severity.py" = ["F401", "F541"]
"src/pages/landing.py" = ["E722", "F811"]
"src/preprocessing/electrical_localisation_preprocessor.py" = ["F401"]
"src/preprocessing/image_localization_preprocessing.py" = ["E741"]
"tests/test_api.py" = ["F811"]
"tests/test_detection_context.py" = ["F401"]
"tests/test_detection_service.py" = ["F401"]
"tests/test_localization_service.py" = ["F401"]
"tests/test_logger.py" = ["F401"]
